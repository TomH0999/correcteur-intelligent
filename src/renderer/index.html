<!doctype html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'" />
  <title>Correcteur Intelligent</title>
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../node_modules/katex/dist/katex.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="../../node_modules/marked/lib/marked.umd.js"></script>
  <script src="../../node_modules/dompurify/dist/purify.min.js"></script>
  <script src="../../node_modules/katex/dist/katex.min.js"></script>
  <script src="../../node_modules/katex/dist/contrib/auto-render.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <aside class="sidebar" aria-label="Navigation principale">
    <div class="sb-brand">
      <div class="logo"><i class="fa-solid fa-spell-check" aria-hidden="true"></i></div>
      <div>
        <div class="brand-name">Correcteur IA</div>
        <div class="brand-sub">BUT Informatique</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-view="claude"><i class="fa-solid fa-wand-magic-sparkles"></i><span>Corriger avec Claude</span></button>
      <button class="nav-item" data-view="dashboard"><i class="fa-solid fa-chart-line"></i><span>Progression</span></button>
      <div class="nav-sep">Mes corrections</div>
      <button class="nav-item" data-view="history"><i class="fa-solid fa-clock-rotate-left"></i><span>Historique</span></button>
      <button class="nav-item" data-view="folders"><i class="fa-solid fa-folder-tree"></i><span>Dossiers</span></button>
      <button class="nav-item" data-view="compare"><i class="fa-solid fa-code-compare"></i><span>Comparer</span></button>
      <div class="nav-sep">S'entraîner</div>
      <button class="nav-item" data-view="cards"><i class="fa-solid fa-layer-group"></i><span>Révisions</span><span class="nav-badge hidden" id="due-badge"></span></button>
      <button class="nav-item" data-view="training"><i class="fa-solid fa-dumbbell"></i><span>Exercices</span></button>
      <div class="nav-sep">Application</div>
      <button class="nav-item nav-api" data-view="new"><i class="fa-solid fa-robot"></i><span>Correction par API</span></button>
      <button class="nav-item nav-api" data-view="queue"><i class="fa-solid fa-list-check"></i><span>File d'attente</span><span class="nav-badge hidden" id="queue-badge"></span></button>
      <button class="nav-item" data-view="settings"><i class="fa-solid fa-gear"></i><span>Réglages</span></button>
    </nav>
    <div class="side-foot">
      <div id="update-pill" class="update-pill hidden"></div>
      <div class="row"><i class="fa-solid fa-robot dim"></i><span id="side-ai">IA : —</span></div>
      <div class="row"><i class="fa-solid fa-lock dim"></i><span>Données locales · <span id="side-version"></span></span></div>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <h1 id="page-title">Nouvelle correction</h1>
      <div class="search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="quick-search" type="search" placeholder="Rechercher une correction… (Ctrl+F)" />
      </div>
    </header>
    <main id="main">
      <section class="page" id="page-claude"></section>
      <section class="page" id="page-new"></section>
      <section class="page" id="page-result"></section>
      <section class="page" id="page-dashboard"></section>
      <section class="page" id="page-history"></section>
      <section class="page" id="page-folders"></section>
      <section class="page" id="page-compare"></section>
      <section class="page" id="page-cards"></section>
      <section class="page" id="page-training"></section>
      <section class="page" id="page-exercise"></section>
      <section class="page" id="page-queue"></section>
      <section class="page" id="page-annotate"></section>
      <section class="page" id="page-settings"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box" id="modal-box">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn" id="modal-cancel">Annuler</button>
        <button class="btn primary" id="modal-ok">OK</button>
      </div>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
